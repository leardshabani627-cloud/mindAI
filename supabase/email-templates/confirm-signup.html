<!-- Supabase → Authentication → Emails → "Confirm signup". Subject: Your Mind code / Kodi yt për Mind -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 440px; margin: 0 auto; padding: 32px 24px; color: #1d221e;">
  <p style="font-family: Georgia, serif; font-size: 28px; color: #1f3b2c; margin: 0 0 24px;">Mind</p>

  <p style="font-size: 16px; margin: 0 0 8px;">Your verification code:</p>
  <p style="font-size: 16px; margin: 0 0 16px; color: #6b736c;">Kodi yt i verifikimit:</p>

  <p style="font-size: 34px; letter-spacing: 8px; font-weight: bold; background: #f1f2f0; border-radius: 10px; padding: 16px; text-align: center; margin: 0 0 24px;">
    {{ .Token }}
  </p>

  <p style="font-size: 14px; color: #6b736c; margin: 0 0 6px;">
    Enter it in Mind to verify your account. If you didn't create an account, you can ignore this email.
  </p>
  <p style="font-size: 14px; color: #6b736c; margin: 0;">
    Shkruaje në Mind për të verifikuar llogarinë. Nëse nuk ke krijuar llogari, mund ta injorosh këtë email.
  </p>
</div>
